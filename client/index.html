<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <!-- Prevent zoom on input focus (iOS) while allowing pinch-zoom; viewport-fit=cover for safe areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- ── Primary SEO ─────────────────────────────────────────────────── -->
    <title>TARSA — App for Couples Who Own a Business Together</title>
    <meta name="description" content="TARSA is the app built for couples who co-own a business. Run your business while protecting your relationship. Structured meeting rhythms, a shared owner board, and goal tracking — so every business conversation happens at the right time." />
    <meta name="keywords" content="app for couples who own a business, co-owner app, business partner app for couples, couple business app, co-preneurs app, family business app, small business communication app, business meeting rhythm, owner board app" />
    <meta name="author" content="TARSA" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://businesscadence.com/" />

    <!-- ── Open Graph (Facebook, LinkedIn, iMessage previews) ────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://businesscadence.com/" />
    <meta property="og:title" content="TARSA — App for Couples Who Own a Business Together" />
    <meta property="og:description" content="Run your business while protecting your relationship. TARSA gives co-owner couples a structured meeting rhythm, shared owner board, and goal tracking — so business stays in the boardroom and life stays yours." />
    <meta property="og:image" content="https://businesscadence.com/manus-storage/og-image-1200x630_b1d804b0.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TARSA — Run your business while protecting your relationship." />
    <meta property="og:site_name" content="TARSA" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter / X Card ──────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@businesscadence" />
    <meta name="twitter:title" content="TARSA — App for Couples Who Own a Business Together" />
    <meta name="twitter:description" content="Run your business while protecting your relationship. The app built for co-owner couples — structured meetings, shared board, goals & KPIs." />
    <meta name="twitter:image" content="https://businesscadence.com/manus-storage/og-image-1200x630_b1d804b0.png" />

    <!-- ── Favicons ───────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/manus-storage/web-apple-touch-icon_a133fc98.png" />

    <!-- ── PWA Manifest ───────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ── iOS PWA meta tags ──────────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TARSA" />

    <!-- ── Android / Chrome PWA ──────────────────────────────────────── -->
    <meta name="theme-color" content="#0F2440" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="TARSA" />

    <!-- ── Fonts ──────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- ── JSON-LD Structured Data ───────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MobileApplication",
      "name": "TARSA",
      "description": "TARSA is the app built for couples who co-own a business together. Structured meeting rhythms, a shared owner board, goal tracking, and KPI dashboards — so every business conversation happens at the right time, in the right place.",
      "url": "https://businesscadence.com",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "iOS, Android",
      "offers": [
        {
          "@type": "Offer",
          "name": "Co-Owner Plan",
          "price": "19.00",
          "priceCurrency": "USD",
          "description": "For couples running one business together. Both co-owners included."
        },
        {
          "@type": "Offer",
          "name": "Growth Plan",
          "price": "29.00",
          "priceCurrency": "USD",
          "description": "For couples running two or more businesses together. Unlimited businesses at no extra charge."
        }
      ],
      "publisher": {
        "@type": "Organization",
        "name": "TARSA",
        "url": "https://businesscadence.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://businesscadence.com/manus-storage/og-image-1200x630_b1d804b0.png"
        }
      },
      "featureList": [
        "Meeting Cadence Command Center",
        "Shared Owner Board for tasks, updates, and issues",
        "Goals and KPI tracking",
        "Weekly business reports",
        "Off the Clock notification mode",
        "Multiple business workspaces",
        "iOS and Android apps"
      ],
      "screenshot": "https://businesscadence.com/manus-storage/og-image-1200x630_b1d804b0.png",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5",
        "ratingCount": "1"
      }
    }
    </script>

    <!-- ── Organization structured data ──────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TARSA",
      "url": "https://businesscadence.com",
      "logo": "https://businesscadence.com/manus-storage/og-image-1200x630_b1d804b0.png",
      "description": "TARSA helps couples who co-own a business stay in sync with structured meeting rhythms, a shared owner board, and goal tracking.",
      "foundingDate": "2024",
      "sameAs": []
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Capacitor runtime (no-op on web, activates on iOS/Android) -->
    <script>
      // Capacitor is loaded by the native layer; this is a safe no-op guard for web
      window.Capacitor = window.Capacitor || {};
    </script>
    <!-- Register service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
